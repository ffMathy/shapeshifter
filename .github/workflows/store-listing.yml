name: Store listing

# Regenerates the Microsoft Store listing import folders (texts, screenshots and logos for every language) with
# packaging/store/listing/make-listing.sh, and uploads them as an artifact. Run it after changing the picker or
# packaging/store/listing/text/*.json, then import the folders in Partner Center (see packaging/store/README.md).
# It runs on Windows, so the screenshots show the Windows look in Segoe UI, with Windows' own fonts for every script.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to render, comma separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  listing:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SHAPESHIFTER_STORE_LANGUAGES: ${{ inputs.languages }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Render and pack
        shell: bash
        run: packaging/store/listing/make-listing.sh artifacts/store-listing

      - uses: actions/upload-artifact@v7
        with:
          name: store-listing
          path: |
            artifacts/store-listing/shapeshifter-store-listing-*/
          retention-days: 30
